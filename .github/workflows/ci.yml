name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: verify (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No dependencies to install: the pipeline, the tests and the serverless
      # handler are stdlib only. If that ever stops being true, this job fails
      # instead of silently testing a different environment.
      - name: tests
        run: python -m unittest discover -s tests -t . -v

      - name: the run is reproducible byte-for-byte
        run: |
          set -euo pipefail
          python main.py --json > first.json
          python main.py --json > second.json
          diff first.json second.json
          python - <<'PY'
          import json
          report = json.load(open('first.json'))
          assert len(report['artifacts']) == 8, report['pipeline']
          assert all(a['hash'] for a in report['artifacts'])
          print('manifest:', ', '.join(f"{a['name']}={a['hash']}" for a in report['artifacts']))
          PY

      - name: the demo handler still imports and declares its entrypoint
        working-directory: demo
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('run', 'api/run.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert hasattr(module, 'handler'), 'demo/api/run.py must expose handler'
          print('demo handler ok')
          PY
